<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      href="imagens/logo.png"
      sizes="32x32"
      type="image/png"
      class="favicon"
    />
    <style type="text/css">
      @import url(style.css);
    </style>
    <title>Academia Alta Forma | Home</title>
  </head>
  <body>
    <header>
      <h1 class="text-center p-4 m-0">Academia Alta Forma</h1>
      <nav class="navbar navbar-expand-lg px-5">
        <div class="container-fluid gap-2 mb-3">
          <a class="navbar-brand" href="index.html#home"
            ><img
              src="imagens/logo.png"
              alt="Logo"
              class="img-fluid"
              style="max-width: 128px; max-height: 128px"
          /></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="index.html#home">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="academia.html#nossa-academia"
                  >Nossa Academia</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="servico.html#nossos-servicos"
                  >Nossos Serviços</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="produtos.html#produtos"
                  >Nossos Produtos</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="faleconosco.html#forms"
                  >Fale Conosco</a
                >
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2 input-search"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-search" type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section
        class="section-fale-forms justify-content-center align-items-center d-flex"
        id="forms"
      >
        <div class="card p-4">
          <h3 class="mb-4 text-center">Fale Conosco</h3>
          <form action="">
            <div class="mb-3">
              <label for="nomeCompleto" class="form-label">Nome Completo</label>
              <input
                type="text"
                class="form-control"
                id="nomeCompleto"
                placeholder="Seu nome"
                required
              />
            </div>

            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label"
                >Seu Email</label
              >
              <input
                type="email"
                class="form-control"
                id="exampleInputEmail1"
                placeholder="seu.email@exemplo.com"
                aria-describedby="emailHelp"
                required
              />
              <div id="emailHelp" class="form-text">
                Não vamos compartilhar esse email com ninguém.
              </div>
            </div>

            <div class="mb-3">
              <label for="telefone" class="form-label"
                >Telefone / WhatsApp</label
              >
              <input
                type="tel"
                class="form-control"
                id="telefone"
                placeholder="(00) 00000-0000"
              />
            </div>

            <hr class="my-4" />

            <div class="mb-3">
              <label for="assunto" class="form-label"
                >Assunto / Motivo do Contato</label
              >
              <select class="form-select" id="assunto" required>
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="suporte">Suporte Técnico</option>
                <option value="duvidas">Dúvidas sobre Produtos/Serviços</option>
                <option value="financeiro">Financeiro / Cobrança</option>
                <option value="reclamacoes">Reclamações ou Sugestões</option>
                <option value="parcerias">Parcerias / Comercial</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="mensagem" class="form-label"
                >Mensagem / Descrição do Problema</label
              >
              <textarea
                class="form-control"
                id="mensagem"
                rows="4"
                placeholder="Descreva sua necessidade ou dúvida detalhadamente..."
                required
              ></textarea>
            </div>

            <!-- Seção 3: Encerramento e LGPD -->
            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="exampleCheck1"
                required
              />
              <label class="form-check-label" for="exampleCheck1"
                >Concordo com o tratamento dos meus dados conforme a
                LGPD.</label
              >
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
